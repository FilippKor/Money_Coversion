<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="thirdpage.css">
  </head>
  <body>
    <img src="/img/a42ac4b69e3ed917f31d4b03994cfadb3f0823e7.png" alt="" class="bitcoin">
    <p class="title">Check live foreign exchange rates</p>
    <img src="/img/9c54a150542fff47a868aafeaadb08f2cc66b558.png" alt="" class="coin">
    <div class="frontpage">
      <div class="frontpage_rates">
        <div class="btns">
        <button class="frontpage_convert">Convert</button>
        <button class="frontpage_single">Single</button>
        <button class="frontpage_history">History</button>
    </div>
        <div class="frontpage_rates_exchange">
        <div class="titles">
          <p class="frontpage_rates_exchange_from">From</p>
          <p class="frontpage_rates_exchange_to">To</p>
          <p class="frontpage_rates_exchange_year">Year</p>
          <p class="frontpage_rates_exchange_month">Month</p>
          <p class="frontpage_rates_exchange_lates">Date</p>
        </div>
        <div class="cont">
          
          <select name="currency" class="frontpage_rates_exchange_amount_dropdown_one">
            <option value="usd">USD</option>
            <option value="euro">EURO</option>
            <option value="pounds">POUNDS</option>
            <option value="yen">YEN</option>
          </select>

          <select name="currencytwo" class="frontpage_rates_exchange_amount_dropdown_two">
            <option value="usd" class="drop_usd">USD</option>
            <option value="euro">EURO</option>
            <option value="pounds">POUNDS</option>
            <option value="yen">YEN</option>
          </select>
          <input
            type="text"
            class="frontpage_rates_exchange_amount_year"
            placeholder="Enter year here"
          />
          <input
            type="text"
            class="frontpage_rates_exchange_amount_month"
            placeholder="Enter month here"
          />
          <input
            type="text"
            class="frontpage_rates_exchange_amount_date"
            placeholder="Enter date here"
          />
        </div>
        </div>
        <div class="current">
            <div class="current_one">
                <button class="import">⏏</button>
                <p class="import_t"> USD </p>
                <p class="import_st"> American Dollar </p>
                <p class="import_num"> 1.00 </p>
            </div>
            <p class="equal">=</p>
            <div class="current_two">
                <button class="export">⏏</button>
                <p class="export_t"> EUR </p>
                <p class="export_st"> EURO </p>
                <p class="export_num"> 0.999 </p>
            </div>
        </div>
        <button class="convert"> Convert </button>
      </div>
    </div>
    
  </body>
</html>
